[package]
name = "enfour-memory"
version = "0.6.1"
default-run = "enfour-memory"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Small, local, source-backed memory for coding agents"

[dependencies]
anyhow = "1"
syn = { version = "2", optional = true, features = ["full", "visit"] }
pulldown-cmark = "=0.13.4"
harper-core = { version = "=2.11.0", default-features = false, features = ["concurrent"] }
quick-xml = "0.39"
moka = { version = "=0.12.16", default-features = false, features = ["sync"] }
axum = "0.8.9"
clap = { version = "4", features = ["derive", "env"] }
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
rmcp = { version = "=3.5.1", features = ["client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
tower-http = { version = "0.7.1", features = ["limit", "timeout"] }
subtle = "2.6.1"
uuid = { version = "1", features = ["v4"] }

[features]
test-support = []
product-check = ["dep:syn"]

[[bin]]
name = "enfour-product-check"
path = "src/bin/enfour-product-check.rs"
required-features = ["product-check"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
